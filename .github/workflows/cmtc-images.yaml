name: CMTC SPIRE images
# Publishes ghcr.io/ephico2real2/cmtc-spire-server and ghcr.io/ephico2real2/cmtc-spire-agent for linux/amd64 and
# linux/arm64 from one source commit, with this repository's own Dockerfile targets (static musl builds, the Go version
# in .go-version). The binaries report 1.16.0-dev-<7-character commit>; the OCI revision label holds the full commit.
# workflow_dispatch only runs from the default branch, so this file lives on ci/images: set SOURCE_SHA and push.
on:
  push:
    branches: [ci/images]
permissions:
  contents: read
env:
  SOURCE_SHA: 0f8fe4d6812c388be9ffd7b6d160e67b59163d95
  REGISTRY: ghcr.io/ephico2real2
concurrency:
  group: cmtc-spire-images
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'ephico2real2/spire'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Validate immutable source
        run: '[[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - name: Checkout the exact image source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Read the Go version
        id: go
        run: echo "version=$(cat .go-version)" >> "$GITHUB_OUTPUT"
      # The Go build cross-compiles (xx), but the prep-spire-* stages run an alpine RUN for the target platform.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push the SPIRE server
        uses: docker/build-push-action@v6
        with:
          context: .
          target: spire-server
          platforms: linux/amd64,linux/arm64
          build-args: goversion=${{ steps.go.outputs.version }}
          push: true
          tags: ${{ env.REGISTRY }}/cmtc-spire-server:sha-${{ env.SOURCE_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/ephico2real2/spire
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.title=cmtc-spire-server
          cache-from: type=gha,scope=cmtc-spire
          cache-to: type=gha,scope=cmtc-spire,mode=max
      - name: Build and push the SPIRE agent
        uses: docker/build-push-action@v6
        with:
          context: .
          target: spire-agent
          platforms: linux/amd64,linux/arm64
          build-args: goversion=${{ steps.go.outputs.version }}
          push: true
          tags: ${{ env.REGISTRY }}/cmtc-spire-agent:sha-${{ env.SOURCE_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/ephico2real2/spire
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.title=cmtc-spire-agent
          cache-from: type=gha,scope=cmtc-spire
          cache-to: type=gha,scope=cmtc-spire,mode=max
      - name: Verify the published images and write the lock
        run: |
          set -euo pipefail
          mkdir -p bundle
          for name in cmtc-spire-server cmtc-spire-agent; do
            docker buildx imagetools inspect "$REGISTRY/$name:sha-$SOURCE_SHA" --format '{{json .Manifest}}' > "bundle/$name.json"
          done
          python3 - <<'PY'
          import json, os, pathlib
          bundle, sha, registry = pathlib.Path('bundle'), os.environ['SOURCE_SHA'], os.environ['REGISTRY']
          images = {}
          for name in ('cmtc-spire-server', 'cmtc-spire-agent'):
              index = json.loads((bundle / f'{name}.json').read_text())
              platforms = sorted(f"{m['platform']['os']}/{m['platform']['architecture']}"
                                 for m in index['manifests'] if m['platform']['os'] != 'unknown')
              assert platforms == ['linux/amd64', 'linux/arm64'], (name, platforms)
              images[name.removeprefix('cmtc-')] = {'image': f"{registry}/{name}@{index['digest']}",
                                                     'tag': f'{registry}/{name}:sha-{sha}'}
          lock = {'source_sha': sha, 'platforms': ['linux/amd64', 'linux/arm64'], 'images': images}
          (bundle / 'images.lock.json').write_text(json.dumps(lock, indent=2) + '\n')
          PY
          lock() { python3 -c 'import json,sys; print(json.load(open("bundle/images.lock.json"))["images"][sys.argv[1]]["image"])' "$1"; }
          server=$(lock spire-server); agent=$(lock spire-agent)
          docker pull -q "$server"; docker pull -q "$agent"
          check() { [ "$(docker inspect "$1" --format "$2")" = "$3" ] || { echo "$1: $2 is not $3" >&2; exit 1; }; }
          check "$server" '{{.Config.User}} {{json .Config.Entrypoint}}' '1000:1000 ["/opt/spire/bin/spire-server","run"]'
          check "$agent" '{{.Config.User}} {{json .Config.Entrypoint}}' '0:0 ["/opt/spire/bin/spire-agent","run"]'
          for image in "$server" "$agent"; do
            check "$image" '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$SOURCE_SHA"
          done
          [ "$(docker run --rm --network none --entrypoint /opt/spire/bin/spire-server "$server" --version 2>&1)" = "1.16.0-dev-${SOURCE_SHA:0:7}" ]
          [ "$(docker run --rm --network none --entrypoint /opt/spire/bin/spire-agent "$agent" --version 2>&1)" = "1.16.0-dev-${SOURCE_SHA:0:7}" ]
          cat bundle/images.lock.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: cmtc-spire-images-${{ env.SOURCE_SHA }}
          path: bundle/
          retention-days: 90
